- type: entity
  id: PartPixie
  parent: [BaseItem, BasePart]
  name: "pixie body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: PixieBlood
        Quantity: 10

- type: entity
  id: TorsoPixie
  name: "pixie torso"
  parent: [PartPixie, BaseTorso]
  components:
  - type: Sprite
    sprite: _DEN/Mobs/Species/Pixie/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: PixieBlood
        Quantity: 20

